[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc-orchestrator"
version = "0.1.0"
description = "A human-governed agentic workflow for planning, implementing, testing, and reviewing software changes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "langgraph",
    "pydantic-settings",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "httpx2>=2.0.0",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["agentic_sdlc_orchestrator"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentic_sdlc_orchestrator"]